services:
  - type: web
    name: cycle-demo
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    # Le déploiement est piloté par GitHub Actions (via Deploy Hook) après
    # succès des tests, et non par un push brut sur main.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
